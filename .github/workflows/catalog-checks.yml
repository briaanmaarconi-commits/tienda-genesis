name: Catalog and storefront checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: node --test backend/tests/metaCatalog.test.mjs
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run test
      - run: npm run build
        env:
          VITE_META_PIXEL_ID: '2845894399129197'
