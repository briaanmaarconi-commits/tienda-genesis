name: Catalog and storefront checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: genesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: node --test backend/tests/*.test.mjs
        env:
          PURCHASE_TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/genesis_test
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run test
      - run: npm run build
        env:
          VITE_META_PIXEL_ID: '2845894399129197'
