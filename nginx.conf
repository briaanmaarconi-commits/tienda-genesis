server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Re-resolving genesis-api on every request (via
    # the $-variable form of proxy_pass below) keeps this working across
    # redeploys of genesis-api — a bare proxy_pass hostname is resolved once
    # at nginx startup and goes stale (502s) once that container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        # No URI part after $genesis_api: with a variable in proxy_pass,
        # nginx does NOT strip the matched location prefix — it would
        # otherwise append the original /api/... request onto this directive's
        # own /api/ suffix, doubling it to /api/api/... upstream.
        set $genesis_api genesis-api:8081;
        proxy_pass http://$genesis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /files/ {
        set $genesis_api genesis-api:8081;
        proxy_pass http://$genesis_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
